name: Safe source syntax check
on: [push, pull_request]
jobs:
  syntax-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse source without executing the keyboard listener
        run: python -m py_compile keylogger.py
